<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kaleido</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main class="app-shell">
    <header class="brand">
      <div class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 48 48">
          <rect x="3" y="3" width="42" height="42" rx="13" fill="#282025"/>
          <rect x="9" y="10" width="30" height="28" rx="6" fill="#553D44"/>
          <path d="M10 17h28v15c0 3.3-2.7 6-6 6H16c-3.3 0-6-2.7-6-6V17Z" fill="#CDD6F4"/>
          <path d="M10 31c5-1 8-10 15-9 5 .7 7 6 13 4v7c0 3.3-2.7 6-6 6H16c-3.3 0-6-2.7-6-6v-2Z" fill="#ECA8BD"/>
          <circle cx="15" cy="13.5" r="1.5" fill="#CDD6F4"/>
          <circle cx="20" cy="13.5" r="1.5" fill="#ECA8BD"/>
          <path d="M36 7.5 37.5 11l3.5 1.5-3.5 1.5-1.5 3.5-1.5-3.5-3.5-1.5 3.5-1.5L36 7.5Z" fill="#CDD6F4"/>
        </svg>
      </div>
      <div class="brand-copy">
        <h1>Kaleido</h1>
        <p>Pick areas. Choose colors.</p>
      </div>
      <div class="current-site">
        <span>On this site</span>
        <strong id="siteName">Open a webpage</strong>
      </div>
    </header>

    <section class="section colors-section">
      <div class="section-heading">
        <h2>Colors</h2>
        <span id="colorCount" class="count-pill">4</span>
      </div>
      <p class="hint">Choose a saved color for an area. Save more colors below.</p>
      <div id="colorLibrary" class="color-library"></div>
      <div class="add-color-row">
        <input id="newColorValue" class="new-color-value" type="color" value="#ECA8BD" aria-label="Choose a color to save">
        <input id="newColorName" class="text-input" type="text" maxlength="32" placeholder="Name this color">
        <button id="saveColor" class="small-button" type="button">Save color</button>
      </div>
      <p id="status" class="status" aria-live="polite"></p>
    </section>

    <section class="section areas-section">
      <div class="section-heading"><h2>Picked areas</h2></div>
      <p class="hint">Pick an area on the page, confirm it, then choose one of your colors.</p>
      <button id="pickArea" class="primary-button" type="button">Pick an area on this page</button>
      <div id="targetList" class="target-list"></div>
    </section>

    <footer>
      <span>Your colors and picked areas stay on this device.</span>
      <a href="privacy.html" target="_blank">Privacy</a>
    </footer>
  </main>
  <script src="popup.js"></script>
</body>
</html>
